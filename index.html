<style>
/* Layout: la laguna 3D ocupa toda la pantalla; la interfaz son carteles de madera pintada flotando encima. */
:root{
  --laguna:#0b3f47; --laguna-hondo:#072a31; --camalote:#8d5fe0; --sol:#ffcf4d; --atardecer:#ff7d3b; --hoja:#6fc26a; --papel:#fff4dc;
  --display:"Chango","Arial Black",Impact,sans-serif;
  --body:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;overflow:hidden;background:var(--laguna-hondo);color:var(--papel);font-family:var(--body);font-size:16px;overscroll-behavior:none;-webkit-user-select:none;user-select:none;touch-action:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid var(--sol);outline-offset:2px}

/* Pantallas */
.screen{position:fixed;inset:0;overflow-y:auto;touch-action:pan-y;display:flex;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(16px + env(safe-area-inset-top,0px)) calc(16px + env(safe-area-inset-bottom,0px));background:linear-gradient(90deg,rgba(7,42,49,.88),rgba(7,42,49,.35) 62%,rgba(7,42,49,.05))}
.wrap{margin:auto 0;width:min(620px,100%);display:flex;flex-direction:column;gap:16px}

es:'El Rebote|Que Tito no toque el agua|Tito rebota de cabeza en cabeza. Si cae en tu marca y no llegás, quedás afuera.|El círculo de color marca dónde cae y a quién le toca|Movete hasta ahí con ◀ ▶ (o A y D, o las flechas)|Cada rebote va más rápido. El último que queda gana|rebotes|¡{a} quedó afuera!|La Catapulta|Saltá en la tabla y volá con la garza|Saltá sobre la tabla para lanzar a Tito. Una garza lo agarra y vos la hacés aletear.|Intento|Tocá cuando la marca pasa por el verde: saltás sobre la tabla|Tito sale volando y lo agarra una garza|Tocá cuando van bajando para aletear. Si aleteás subiendo, perdés fuerza|Tocá con la marca en verde|Tocá cuando están bajando|La Escalada|Subí antes de que llegue el agua|Tito salta de rama en rama y el agua sube sin parar. Gana el que llega más alto.|Intento|Tito se hamaca colgado de la rama|Tocá cuando el anillo está verde: salta a la rama siguiente|Si erra, cae una rama. Si lo alcanza el agua, se termina|Tocá en verde|¡Lo alcanzó el agua!|Tito Ninja|Encontrá al Tito distinto|Doce Titos iguales, pero uno hace algo distinto. Cuanto antes lo encontrás, más puntos.|Ronda|Mirá bien cómo se mueven todos|Tocá al que hace algo distinto|Si te equivocás, perdés tiempo|¿Cuál es distinto? Tocalo|¡Lo encontraste!|Ese no|¡Era este!|Tirá la Caña|Pescá como en los viejos tiempos|Tirá la caña sobre una sombra, enganchá el pique y recogé sin cortar la línea.|Tiro|Tocá una sombra del agua para tirar la caña|Cuando la boya se hunde del todo, tocá rápido para enganchar|Mantené para recoger y soltá para aflojar. Dejá la marca en el verde: muy a la derecha se corta, muy a la izquierda se escapa|Tocá una sombra para tirar|Esperá a que se hunda la boya…|¡Ahora!|Mantené para recoger: la marca en verde|Una bota vieja|Mojarra|¡Dorado grande!|¡Tito dorado!|¡Se cortó la línea!|¡Se escapó!|Se asustó',
en:'Bounce|Keep Tito out of the water|Tito bounces from head to head. If he lands on your mark and you miss him, you’re out.|The colored circle shows where he lands and whose turn it is|Move there with ◀ ▶ (or A and D, or the arrows)|Every bounce is faster. Last one standing wins|bounces|{a} is out!|The Catapult|Jump on the plank and fly with the heron|Jump on the plank to launch Tito. A heron grabs him and you make it flap.|Try|Tap when the mark crosses the green: you jump on the plank|Tito flies up and a heron grabs him|Tap while descending to flap. Flapping on the way up wastes power|Tap on green|Tap while descending|The Climb|Climb before the water gets you|Tito jumps from branch to branch while the water keeps rising. Highest climb wins.|Try|Tito swings from the branch|Tap when the ring is green: he jumps to the next branch|Miss and he drops a branch. If the water reaches him, it’s over|Tap on green|The water got him!|Ninja Tito|Find the odd Tito|Twelve identical Titos, but one acts differently. The faster you find him, the more points.|Round|Watch how they all move|Tap the one doing something different|Wrong taps cost you time|Which one is different? Tap him|Found him!|Not that one|It was this one!|Gone Fishing|Fish like the old days|Cast on a shadow, hook the bite and reel in without snapping the line.|Cast|Tap a shadow in the water to cast|When the float sinks all the way, tap fast to hook it|Hold to reel, release to ease off. Keep the mark on green: too far right snaps the line, too far left lets it escape|Tap a shadow to cast|Wait for the float to sink…|Now!|Hold to reel: keep the mark on green|An old boot|Small fish|Big golden fish!|Golden Tito!|The line snapped!|It got away!|It got scared',
pt:'O Rebote|Não deixe o Tito cair na água|Tito rebate de cabeça em cabeça. Se cair na sua marca e você não chegar, está fora.|O círculo colorido mostra onde ele cai e de quem é a vez|Vá até lá com ◀ ▶ (ou A e D, ou as setas)|Cada rebote é mais rápido. O último que sobrar vence|rebotes|{a} está fora!|A Catapulta|Pule na tábua e voe com a garça|Pule na tábua para lançar o Tito. Uma garça o pega e você a faz bater as asas.|Tentativa|Toque quando a marca passar pelo verde: você pula na tábua|Tito voa e uma garça o pega|Toque na descida para bater as asas. Bater subindo desperdiça força|Toque no verde|Toque na descida|A Escalada|Suba antes que a água chegue|Tito pula de galho em galho e a água não para de subir. Vence quem chegar mais alto.|Tentativa|Tito balança pendurado no galho|Toque quando o anel estiver verde: ele pula para o próximo galho|Se errar, cai um galho. Se a água o alcançar, acabou|Toque no verde|A água o alcançou!|Tito Ninja|Encontre o Tito diferente|Doze Titos iguais, mas um faz algo diferente. Quanto antes achar, mais pontos.|Rodada|Veja bem como todos se movem|Toque no que faz algo diferente|Errar faz perder tempo|Qual é o diferente? Toque nele|Achou!|Esse não|Era este!|Pescaria|Pesque como nos velhos tempos|Lance sobre uma sombra, fisgue e recolha sem arrebentar a linha.|Lance|Toque em uma sombra na água para lançar|Quando a boia afundar de vez, toque rápido para fisgar|Segure para recolher e solte para afrouxar. Mantenha a marca no verde: muito à direita arrebenta, muito à esquerda escapa|Toque em uma sombra para lançar|Espere a boia afundar…|Agora!|Segure para recolher: marca no verde|Uma bota velha|Lambari|Dourado grande!|Tito dourado!|A linha arrebentou!|Escapou!|Ele se assustou',
fr:'Le Rebond|Tito ne doit pas toucher l’eau|Tito rebondit de tête en tête. S’il tombe sur ta marque et que tu le rates, tu es éliminé.|Le cercle coloré montre où il tombe et à qui c’est le tour|Va là-bas avec ◀ ▶ (ou A et D, ou les flèches)|Chaque rebond est plus rapide. Le dernier en jeu gagne|rebonds|{a} est éliminé !|La Catapulte|Saute sur la planche et vole avec le héron|Saute sur la planche pour lancer Tito. Un héron l’attrape et tu le fais battre des ailes.|Essai|Touche quand la marque passe sur le vert : tu sautes sur la planche|Tito s’envole et un héron l’attrape|Touche en descente pour battre des ailes. En montée, tu perds de la force|Touche sur le vert|Touche en descente|L’Escalade|Grimpe avant que l’eau n’arrive|Tito saute de branche en branche et l’eau monte sans arrêt. Le plus haut gagne.|Essai|Tito se balance à la branche|Touche quand l’anneau est vert : il saute à la branche suivante|S’il rate, il descend d’une branche. Si l’eau l’atteint, c’est fini|Touche sur le vert|L’eau l’a rattrapé !|Tito Ninja|Trouve le Tito différent|Douze Titos identiques, mais l’un agit autrement. Plus tu le trouves vite, plus tu marques.|Manche|Regarde bien comment ils bougent|Touche celui qui fait quelque chose de différent|Une erreur fait perdre du temps|Lequel est différent ? Touche-le|Trouvé !|Pas celui-là|C’était lui !|À la Pêche|Pêche comme au bon vieux temps|Lance sur une ombre, ferre et ramène sans casser la ligne.|Lancer|Touche une ombre dans l’eau pour lancer|Quand le flotteur coule complètement, touche vite pour ferrer|Maintiens pour ramener, relâche pour détendre. Garde la marque sur le vert : trop à droite ça casse, trop à gauche ça s’échappe|Touche une ombre pour lancer|Attends que le flotteur coule…|Maintenant !|Maintiens pour ramener : marque sur le vert|Une vieille botte|Petit poisson|Grand poisson doré !|Tito doré !|La ligne a cassé !|Il s’est échappé !|Il a eu peur',
de:'Der Abpraller|Tito darf nicht ins Wasser|Tito hüpft von Kopf zu Kopf. Landet er auf deiner Markierung und du verpasst ihn, bist du raus.|Der farbige Kreis zeigt, wo er landet und wer dran ist|Geh mit ◀ ▶ dorthin (oder A und D, oder Pfeiltasten)|Jeder Abpraller wird schneller. Wer übrig bleibt, gewinnt|Abpraller|{a} ist raus!|Das Katapult|Spring auf die Wippe und flieg mit dem Reiher|Spring auf die Wippe, um Tito abzuschießen. Ein Reiher fängt ihn und du lässt ihn flattern.|Versuch|Tippe, wenn die Marke im Grünen ist: du springst auf die Wippe|Tito fliegt hoch und ein Reiher fängt ihn|Tippe im Sinkflug zum Flattern. Beim Steigen verschwendest du Kraft|Tippe im Grünen|Tippe im Sinkflug|Der Aufstieg|Klettere, bevor das Wasser kommt|Tito springt von Ast zu Ast, während das Wasser steigt. Wer am höchsten kommt, gewinnt.|Versuch|Tito schwingt am Ast|Tippe, wenn der Ring grün ist: er springt zum nächsten Ast|Daneben heißt ein Ast zurück. Erreicht ihn das Wasser, ist Schluss|Tippe im Grünen|Das Wasser hat ihn!|Ninja-Tito|Finde den anderen Tito|Zwölf gleiche Titos, aber einer verhält sich anders. Je schneller du ihn findest, desto mehr Punkte.|Runde|Schau genau, wie sich alle bewegen|Tippe auf den, der etwas anders macht|Fehler kosten Zeit|Welcher ist anders? Tippe ihn an|Gefunden!|Der nicht|Der war es!|Angeln|Angeln wie früher|Wirf auf einen Schatten aus, hake den Biss an und hole ein, ohne dass die Schnur reißt.|Wurf|Tippe auf einen Schatten im Wasser zum Auswerfen|Wenn die Pose ganz abtaucht, tippe schnell zum Anhaken|Halten zum Einholen, loslassen zum Nachgeben. Marke im Grünen halten: zu weit rechts reißt die Schnur, zu weit links entkommt er|Tippe zum Auswerfen auf einen Schatten|Warte, bis die Pose abtaucht…|Jetzt!|Halten zum Einholen: Marke im Grünen|Ein alter Stiefel|Kleiner Fisch|Großer Goldfisch!|Goldener Tito!|Die Schnur ist gerissen!|Er ist entkommen!|Er hat sich erschreckt',
it:'Il Rimbalzo|Tito non deve toccare l’acqua|Tito rimbalza di testa in testa. Se cade sul tuo segno e non arrivi, sei fuori.|Il cerchio colorato mostra dove cade e a chi tocca|Vai lì con ◀ ▶ (o A e D, o le frecce)|Ogni rimbalzo è più veloce. Vince l’ultimo rimasto|rimbalzi|{a} è fuori!|La Catapulta|Salta sull’asse e vola con l’airone|Salta sull’asse per lanciare Tito. Un airone lo afferra e tu lo fai sbattere le ali.|Tentativo|Tocca quando il segno passa sul verde: salti sull’asse|Tito vola e un airone lo afferra|Tocca in discesa per sbattere le ali. In salita sprechi forza|Tocca sul verde|Tocca in discesa|La Scalata|Sali prima che arrivi l’acqua|Tito salta di ramo in ramo e l’acqua continua a salire. Vince chi arriva più in alto.|Tentativo|Tito dondola dal ramo|Tocca quando l’anello è verde: salta al ramo successivo|Se sbaglia, scende di un ramo. Se l’acqua lo raggiunge, è finita|Tocca sul verde|L’acqua l’ha raggiunto!|Tito Ninja|Trova il Tito diverso|Dodici Tito uguali, ma uno fa qualcosa di diverso. Prima lo trovi, più punti fai.|Round|Guarda bene come si muovono|Tocca quello che fa qualcosa di diverso|Sbagliare fa perdere tempo|Qual è diverso? Toccalo|Trovato!|Non quello|Era questo!|Si Pesca|Pesca come una volta|Lancia su un’ombra, ferra e recupera senza spezzare il filo.|Lancio|Tocca un’ombra nell’acqua per lanciare|Quando il galleggiante affonda del tutto, tocca subito per ferrare|Tieni premuto per recuperare, rilascia per allentare. Tieni il segno sul verde: troppo a destra si spezza, troppo a sinistra scappa|Tocca un’ombra per lanciare|Aspetta che il galleggiante affondi…|Ora!|Tieni premuto: segno sul verde|Un vecchio stivale|Pesciolino|Grande pesce dorato!|Tito dorato!|Il filo si è spezzato!|È scappato!|Si è spaventato',
ja:'バウンド|ティトを水に落とすな|ティトは頭から頭へ跳ねる。自分のマークに落ちて間に合わなければ脱落。|色の円が落下地点と担当を示す|◀ ▶(AとD、矢印キー)でそこへ移動|跳ねるたびに速くなる。最後に残った人の勝ち|回|{a}は脱落!|カタパルト|板に飛び乗り、サギと飛べ|板に飛び乗ってティトを発射。サギがつかまえたら羽ばたかせよう。|回目|マークが緑を通る時にタップして板に飛び乗る|ティトが飛び、サギがつかまえる|下降中にタップで羽ばたき。上昇中だと力を無駄にする|緑でタップ|下降中にタップ|クライム|水が来る前に登れ|ティトは枝から枝へ跳ぶ。水は上がり続ける。一番高い人の勝ち。|回目|ティトが枝にぶら下がって揺れる|リングが緑の時にタップで次の枝へ|失敗すると一段落ちる。水に追いつかれたら終了|緑でタップ|水に追いつかれた!|忍者ティト|違うティトを探せ|同じティトが12匹。でも1匹だけ動きが違う。早く見つけるほど高得点。|ラウンド|全員の動きをよく見る|違う動きの1匹をタップ|間違えると時間が減る|どれが違う?タップしよう|見つけた!|それじゃない|これだった!|釣り|昔ながらの釣り|影を狙って投げ、アタリで合わせ、糸を切らずに巻き上げよう。|投目|水中の影をタップして投げる|ウキが完全に沈んだらすぐタップして合わせる|長押しで巻く、離すと緩む。マークを緑に保つ:右すぎると糸が切れ、左すぎると逃げる|影をタップして投げる|ウキが沈むのを待て…|今だ!|長押しで巻く:マークを緑に|古いブーツ|小魚|大きな黄金魚!|黄金ティト!|糸が切れた!|逃げられた!|驚いて逃げた',
zh:'弹跳|别让蒂托落水|蒂托在头顶间弹跳。如果落在你的标记上而你没接住,你就出局。|彩色圆圈显示落点和该谁接|用 ◀ ▶(或 A、D、方向键)移动到那里|每次弹跳都更快。最后留下的人获胜|次弹跳|{a} 出局!|弹射器|跳上木板,与白鹭同飞|跳上木板弹射蒂托。白鹭接住它后,由你让它拍翅。|次|标记经过绿色时点击:跳上木板|蒂托飞起,白鹭接住它|下降时点击拍翅。上升时拍翅会浪费力气|在绿色时点击|下降时点击|攀登|赶在水涨上来之前爬|蒂托在树枝间跳跃,水位不断上升。爬得最高的人获胜。|次|蒂托挂在树枝上摆动|圆环变绿时点击:跳向下一根树枝|失败会掉下一根树枝。被水追上就结束|在绿色时点击|被水追上了!|忍者蒂托|找出不一样的蒂托|十二只一样的蒂托,但有一只动作不同。找得越快分数越高。|回合|仔细观察它们的动作|点击动作不同的那只|点错会损失时间|哪只不一样?点它|找到了!|不是这只|是这只!|钓鱼|老派钓鱼|抛向水中的影子,咬钩时提竿,收线时别把线拉断。|投|点击水中的影子抛竿|浮标完全沉下时快速点击提竿|按住收线,松开放线。让标记保持在绿色:太靠右线会断,太靠左鱼会跑|点击影子抛竿|等待浮标下沉…|就是现在!|按住收线:标记保持绿色|一只旧靴子|小鱼|金色大鱼!|金色蒂托!|线断了!|它跑了!|它被吓跑了'};

for(const l in TX)if(TX[l].split('|').length!==KS.length)console.error('i18n',l,TX[l].split('|').length,KS.length)}
{const U={"es": ["¡Remate!", "Saltá con ▲ (W o ↑): pasás por arriba de otro y, si le pegás a Tito en el aire, rematás más rápido", "Tito se hamaca colgado de la rama", "Tocá para soltarlo: sale para donde se está moviendo", "En el aire, mantené un costado de la pantalla para acomodarte y agarrar otra rama", "Tocá para saltar · en el aire, mantené un costado"], "en": ["Spike!", "Jump with ▲ (W or ↑): hop over others, and hit Tito in the air for a faster spike", "Tito swings from the branch", "Tap to let go: he flies the way he’s moving", "In the air, hold one side of the screen to steer and grab another branch", "Tap to jump · in the air, hold a side"], "pt": ["Cortada!", "Pule com ▲ (W ou ↑): passe por cima dos outros e, se acertar o Tito no ar, a cortada sai mais rápida", "Tito balança pendurado no galho", "Toque para soltar: ele sai para onde está indo", "No ar, segure um lado da tela para se ajustar e pegar outro galho", "Toque para pular · no ar, segure um lado"], "fr": ["Smash !", "Saute avec ▲ (W ou ↑) : passe par-dessus les autres et frappe Tito en l’air pour un smash plus rapide", "Tito se balance à la branche", "Touche pour lâcher : il part dans le sens de son mouvement", "En l’air, maintiens un côté de l’écran pour te placer et attraper une autre branche", "Touche pour sauter · en l’air, maintiens un côté"], "de": ["Schmetterball!", "Spring mit ▲ (W oder ↑): über andere hinweg, und triffst du Tito in der Luft, wird der Schmetterball schneller", "Tito schwingt am Ast", "Tippe zum Loslassen: Er fliegt in Schwungrichtung", "In der Luft hältst du eine Bildschirmseite, um dich auszurichten und einen anderen Ast zu greifen", "Tippen zum Springen · in der Luft eine Seite halten"], "it": ["Schiacciata!", "Salta con ▲ (W o ↑): passi sopra gli altri e, se colpisci Tito in aria, la schiacciata è più veloce", "Tito dondola dal ramo", "Tocca per lasciarlo: parte nella direzione in cui si muove", "In aria, tieni premuto un lato dello schermo per aggiustarti e prendere un altro ramo", "Tocca per saltare · in aria, tieni un lato"], "ja": ["スパイク!", "▲(Wまたは↑)でジャンプ:他の人を飛び越え、空中でティトを打つと速いスパイクに", "ティトが枝にぶら下がって揺れる", "タップで手を放す:動いている方向へ飛ぶ", "空中では画面の片側を長押しして調整し、別の枝をつかむ", "タップでジャンプ · 空中は片側を長押し"], "zh": ["扣杀!", "用 ▲(W 或 ↑)跳跃:可越过其他人,在空中击中蒂托能打出更快的扣杀", "蒂托挂在树枝上摆动", "点击松手:它会沿摆动方向飞出", "在空中按住屏幕一侧来调整,抓住另一根树枝", "点击起跳 · 空中按住一侧"]},K=['rb_spike','rb_4','es_1','es_2','es_3','es_p'];for(const l in U)U[l].forEach((v,i)=>{I18N[l][K[i]]=v})}
{const U={"es": ["Tito rebota de cabeza en cabeza durante 30 segundos. Cada rebote suma, y si cae en tu marca y no llegás, perdés 2.", "Cada rebote va más rápido. Gana el que tiene más al terminar el tiempo", "{a}: −2", "Correo Aéreo", "Aros, garza y aterrizaje en la balsa", "Lanzá a Tito, guiá a la garza por los aros y soltalo sobre la balsa. Sumás puntos por cada aro y por aterrizar en el centro.", "Tito sale volando y lo agarra una garza", "Tocá para subir y pasá por los aros. Por el medio vale el doble", "Tocá para aletear y pasar por los aros", "¡Soltalo! Tocá sobre la balsa", "Después del último aro, tocá para soltarlo sobre la balsa", "Te hamacás de la rama con las dos manos y con Tito a caballito", "Tocá para soltarte: salís para donde te estás moviendo", "Te hamacás, soltás y agarrás la rama siguiente. Y el agua sube sin parar. Gana el que llega más alto."], "en": ["Tito bounces from head to head for 30 seconds. Each bounce scores, and if he lands on your mark and you miss, you lose 2.", "Each bounce is faster. Most points when time runs out wins", "{a}: −2", "Air Mail", "Rings, a heron and a raft landing", "Launch Tito, guide the heron through the rings and drop him on the raft. Score for each ring and for landing in the center.", "Tito flies up and a heron grabs him", "Tap to climb and fly through the rings. The middle is worth double", "Tap to flap and clear the rings", "Drop him! Tap over the raft", "After the last ring, tap to drop him on the raft", "You swing from the branch with both hands, Tito on your back", "Tap to let go: you fly the way you’re moving", "Swing, let go and grab the next branch while the water keeps rising. Highest climb wins."], "pt": ["Tito rebate de cabeça em cabeça por 30 segundos. Cada rebote soma, e se cair na sua marca e você não chegar, perde 2.", "Cada rebote é mais rápido. Vence quem tiver mais no fim do tempo", "{a}: −2", "Correio Aéreo", "Aros, garça e pouso na balsa", "Lance o Tito, guie a garça pelos aros e solte-o na
